<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Armazenagem</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="/static/css/armazenagem.css">


    <!-- FONTE -->

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

</head>


<body>


<header>

    <h1>🏗️ Armazenagem</h1>

    <p>
        Controle e organização de produtos no estoque
    </p>

</header>


<main>


    <!-- ==========================================
         ALERTA
    =========================================== -->

    <div
        id="alerta"
        class="alerta azul">

        <span id="icone_alerta">
            ℹ️
        </span>

        <span id="mensagem_alerta">
            Sistema pronto para armazenagem
        </span>

    </div>



    <!-- ==========================================
         PACOTES DISPONÍVEIS
    =========================================== -->

    <section class="card">

        <h2>
            Pacotes Disponíveis
        </h2>


        <div
            class="tabela_armazenagem"
            id="tabela_armazenagem">

        </div>

    </section>



    <!-- ==========================================
         ARMAZENAR PRODUTO
    =========================================== -->

    <section class="card">

        <h2>
            Armazenar Produto
        </h2>


        <div class="bloco_armazenar">


            <!-- PACOTE -->

            <div class="campo">

                <h3>
                    Pacote
                </h3>


                <input
                    type="text"
                    id="pacote_produto"
                    placeholder="Digite o código do pacote">


            </div>



            <!-- ENDEREÇO -->

            <div
                class="campo_end"
                id="div_inserir_endereco">

                <h3>
                    Endereço
                </h3>


                <input
                    type="text"
                    id="endereco_produto"
                    placeholder="Ex: A01-B03">

            </div>


        </div>



        <!-- BOTÃO -->

        <div class="area_botao">

            <button
                type="button"
                class="verde"
                id="btn_armazenar">

                 Armazenar Produto

            </button>

        </div>


    </section>


</main>



<!-- ==========================================
     JAVASCRIPT
=========================================== -->

<script
    type="module"
    src="/static/script.js">
</script>


</body>

</html>
