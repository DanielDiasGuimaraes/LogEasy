<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="/static/css/cadastro_produto.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <h1>➕ Cadastro de Produtos</h1>

    <p>Cadastre novos produtos no sistema</p>

</header>

<main>

    <div class="card">

        <div class="campo">

            <label>Nome do Produto</label>

            <input type="text" id="nome_produto" placeholder="Digite o nome do produto">

        </div>

        <div class="campo">

            <label>Descrição</label>

            <input type="text" id="descricao_produto" placeholder="Descrição do produto">

        </div>

        <div class="campo">

            <label>Modelo</label>

            <input type="text" id="modelo_produto" placeholder="Modelo">

        </div>

        <div class="campo">

            <label>Fabricante</label>

            <input type="text" id="fabricante_produto" placeholder="Fabricante">

        </div>

        <div class="linha">

            <div class="campo">

                <label>Preço de Custo</label>

                <input type="number"
                    id="preco_custo_produto"
                    placeholder="0,00"
                    min="0"
                    step="0.01">

            </div>

            <div class="campo">

                <label>Preço de Venda</label>

                <input type="number"
                    id="preco_venda_produto"
                    placeholder="0,00"
                    min="0"
                    step="0.01">

            </div>

        </div>

        <div class="campo">

            <label>EAN / Código de Barras</label>

            <input type="text"
                id="ean"
                placeholder="Código EAN">

        </div>

        <button class="btnCadastrar" onclick="cadastrar_produto()">

            ➕ Cadastrar Produto

        </button>

    </div>

</main>

<!-- Notificação -->

<div id="notificacao" class="notificacao">

    <span id="textoNotificacao"></span>

    <div class="barra"></div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
